

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>DARK CHAT // GLOBAL MQTT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; background: #000; color: #00ff66; }
    #box { display: flex; flex-direction: column; height: 100%; background: #050d08; }
    #head { border-bottom: 1px solid #00ff66; padding: 10px 14px; background: #00220f; font-weight: bold; display: flex; justify-content: space-between; font-size: 13px; }
    #term { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .sys { color: #00aa44; font-style: italic; font-size: 12px; text-align: center; margin: 4px 0; }
    .bubble { max-width: 80%; padding: 8px 12px; border-radius: 6px; word-break: break-word; line-height: 1.4; font-size: 14px; }
    .my-msg { align-self: flex-start; background: #002b11; border: 1px solid #00ff66; color: #55ffff; }
    .peer-msg { align-self: flex-end; background: #2b1d00; border: 1px solid #ffaa00; color: #ffaa00; text-align: right; }
    .sender-tag { font-size: 11px; font-weight: bold; margin-bottom: 3px; display: block; }
    #inbox { border-top: 1px solid #00ff66; display: flex; align-items: center; gap: 6px; background: #000; padding: 8px 10px; }
    #input-wrapper { flex: 1; display: flex; align-items: center; border: 1px solid #00ff66; border-radius: 4px; background: #05140a; padding: 2px 8px; }
    #p { color: #00ff66; font-weight: bold; margin-right: 6px; }
    #msg { flex: 1; background: transparent; border: none; color: #00ff66; padding: 8px 0; outline: none; font-size: 15px; }
    #send { background: #003314; color: #00ff66; border: 1px solid #00ff66; padding: 10px 18px; cursor: pointer; font-weight: bold; border-radius: 4px; }
    #send:hover { background: #00ff66; color: #000; }
  </style>
</head>
<body>
  <div id="box">
    <div id="head"><span>[DARK-CHAT // MQTT]</span><span id="role">CONNECTING TO BROKER...</span></div>
    <div id="term">
      <div class="sys">> Cloud MQTT Relay Active. Global Reach.</div>
    </div>
    <div id="inbox">
      <div id="input-wrapper">
        <span id="p">></span>
        <input type="text" id="msg" placeholder="Type text..." autocomplete="off">
      </div>
      <button id="send" onclick="send()">SEND</button>
    </div>
  </div>
  <script>
    var myId = "Anonymous " + Math.floor(Math.random() * 1 + 9);
    var term = document.getElementById("term");
    var input = document.getElementById("msg");
    var roleSpan = document.getElementById("role");
    var topic = "lilygo/darkchat/room1";

    // المنفذ 8884 مع SSL لدعم HTTPS على الهواتف والمتصفحات الحديثة بأمان
    var client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", myId);

    client.onConnectionLost = function(responseObject) {
      var d = document.createElement("div");
      d.className = "sys";
      d.innerText = "> [ALERT] Disconnected from MQTT broker.";
      term.appendChild(d);
    };

    client.onMessageArrived = function(message) {
      try {
        var data = JSON.parse(message.payloadString);
        var b = document.createElement("div");
        var isMe = (data.senderId === myId);
        b.className = "bubble " + (isMe ? "my-msg" : "peer-msg");
        b.innerHTML = "<span class='sender-tag'>" + data.u + "</span>" + escapeHtml(data.m);
        term.appendChild(b);
        term.scrollTop = term.scrollHeight;
      } catch(err) {
        console.error(err);
      }
    };

    client.connect({
      useSSL: true,
      onSuccess: function() {
        roleSpan.innerText = "IDENTITY: " + myId;
        client.subscribe(topic);
        var sys = document.createElement("div");
        sys.className = "sys";
        sys.innerText = "> Joined Room: " + topic;
        term.appendChild(sys);
      }
    });

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML;
    }

    function send(){
      var val = input.value.trim();
      if(val && client.isConnected()){
        var payload = JSON.stringify({
          senderId: myId,
          u: myId,
          m: val
        });
        var message = new Paho.MQTT.Message(payload);
        message.destinationName = topic;
        client.send(message);
        input.value = "";
      }
    }
    input.addEventListener("keypress", function(e){ if(e.key === "Enter") send(); });
  </script>
</body>
</html>

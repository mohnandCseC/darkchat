<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>DARK CHAT // GLOBAL MQTT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; background: #000; color: #00ff66; }
    #box { display: flex; flex-direction: column; height: 100%; background: #050d08; }
    #head { border-bottom: 1px solid #00ff66; padding: 10px 14px; background: #00220f; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    #status-indicator { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ff3333; margin-right: 6px; box-shadow: 0 0 6px #ff3333; }
    #status-indicator.online { background: #00ff66; box-shadow: 0 0 6px #00ff66; }
    #term { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .sys { color: #00aa44; font-style: italic; font-size: 12px; text-align: center; margin: 4px 0; }
    .bubble { max-width: 80%; padding: 8px 12px; border-radius: 6px; word-break: break-word; line-height: 1.4; font-size: 14px; }
    .my-msg { align-self: flex-start; background: #002b11; border: 1px solid #00ff66; color: #55ffff; }
    .peer-msg { align-self: flex-end; background: #2b1d00; border: 1px solid #ffaa00; color: #ffaa00; text-align: right; }
    .sender-tag { font-size: 11px; font-weight: bold; margin-bottom: 3px; display: block; }
    #inbox { border-top: 1px solid #00ff66; display: flex; align-items: center; gap: 6px; background: #000; padding: 8px 10px; }
    #input-wrapper { flex: 1; display: flex; align-items: center; border: 1px solid #00ff66; border-radius: 4px; background: #05140a; padding: 2px 8px; }
    #p { color: #00ff66; font-weight: bold; margin-right: 6px; }
    #msg { flex: 1; background: transparent; border: none; color: #00ff66; padding: 8px 0; outline: none; font-size: 15px; }
    #send { background: #003314; color: #00ff66; border: 1px solid #00ff66; padding: 10px 18px; cursor: pointer; font-weight: bold; border-radius: 4px; }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }
    #send:hover:not(:disabled) { background: #00ff66; color: #000; }
  </style>
</head>
<body>
  <div id="box">
    <div id="head">
      <div>
        <span id="status-indicator"></span>
        <span>[DARK-CHAT // MQTT]</span>
      </div>
      <span id="role">ASSIGNING IDENTITY...</span>
    </div>
    <div id="term">
      <div class="sys">> Initializing secure cloud broker uplink...</div>
    </div>
    <div id="inbox">
      <div id="input-wrapper">
        <span id="p">></span>
        <input type="text" id="msg" placeholder="Type text..." autocomplete="off">
      </div>
      <button id="send" onclick="send()">SEND</button>
    </div>
  </div>

  <script>
    var randomSuffix = Math.random().toString(36).substring(2, 7);
    var clientId = "WebClient-" + Date.now() + "-" + randomSuffix;
    
    // الاحتفاظ بالاسم في الذاكرة المؤقتة للجلسة الحالية حتى لا يتغير عند عمل Refresh
    var myName = sessionStorage.getItem("darkchat_name") || "";
    var nameAssigned = (myName !== "");

    var term = document.getElementById("term");
    var input = document.getElementById("msg");
    var roleSpan = document.getElementById("role");
    var statusDot = document.getElementById("status-indicator");
    var sendBtn = document.getElementById("send");

    var chatTopic = "lilygo/darkchat/room1";
    var counterTopic = "lilygo/darkchat/counter";

    var client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", clientId);

    function setOnline(state) {
      if (state) {
        statusDot.className = "online";
        if (nameAssigned) {
          sendBtn.disabled = false;
          roleSpan.innerText = myName + " [ONLINE]";
        }
      } else {
        statusDot.className = "";
        sendBtn.disabled = true;
        roleSpan.innerText = "OFFLINE - RECONNECTING...";
      }
    }

    client.onConnectionLost = function() {
      setOnline(false);
      var d = document.createElement("div");
      d.className = "sys";
      d.innerText = "> [DISCONNECTED] Reconnecting to broker...";
      term.appendChild(d);
      term.scrollTop = term.scrollHeight;
      setTimeout(connectBroker, 3000);
    };

    client.onMessageArrived = function(message) {
      // استقبال قيمة العداد لتحديد الاسم التسلسلي
      if (message.destinationName === counterTopic && !nameAssigned) {
        var currentCount = parseInt(message.payloadString) || 0;
        var nextCount = currentCount + 1;
        myName = "Anonymous " + nextCount;
        nameAssigned = true;
        sessionStorage.setItem("darkchat_name", myName);

        // تحديث العداد على السيرفر كـ Retained ليعرف المستخدم التالي رقمه
        var counterMsg = new Paho.MQTT.Message(nextCount.toString());
        counterMsg.destinationName = counterTopic;
        counterMsg.retained = true;
        counterMsg.qos = 1;
        client.send(counterMsg);

        setOnline(true);
        var sys = document.createElement("div");
        sys.className = "sys";
        sys.innerText = "> You joined as: " + myName;
        term.appendChild(sys);
        term.scrollTop = term.scrollHeight;
        return;
      }

      // استقبال رسائل الدردشة
      if (message.destinationName === chatTopic) {
        try {
          var data = JSON.parse(message.payloadString);
          var b = document.createElement("div");
          var isMe = (data.senderId === clientId);
          b.className = "bubble " + (isMe ? "my-msg" : "peer-msg");
          b.innerHTML = "<span class='sender-tag'>" + escapeHtml(data.u) + "</span>" + escapeHtml(data.m);
          term.appendChild(b);
          term.scrollTop = term.scrollHeight;
        } catch(err) {
          console.error("Payload error:", err);
        }
      }
    };

    function connectBroker() {
      client.connect({
        useSSL: true,
        timeout: 10,
        keepAliveInterval: 30,
        cleanSession: true,
        onSuccess: function() {
          // الاشتراك في غرفة الشات وغرفة العداد
          client.subscribe(chatTopic, { qos: 1 });
          client.subscribe(counterTopic, { qos: 1 });

          if (nameAssigned) {
            setOnline(true);
          } else {
            // مهلة احتياطية: إذا كان العداد فارغاً تماماً في السيرفر لأول مرة
            setTimeout(function() {
              if (!nameAssigned) {
                myName = "Anonymous 1";
                nameAssigned = true;
                sessionStorage.setItem("darkchat_name", myName);

                var counterMsg = new Paho.MQTT.Message("1");
                counterMsg.destinationName = counterTopic;
                counterMsg.retained = true;
                counterMsg.qos = 1;
                client.send(counterMsg);

                setOnline(true);
              }
            }, 1200);
          }

          var sys = document.createElement("div");
          sys.className = "sys";
          sys.innerText = "> [CONNECTED] Room: " + chatTopic;
          term.appendChild(sys);
          term.scrollTop = term.scrollHeight;
        },
        onFailure: function(e) {
          setOnline(false);
          console.warn("Connect failed, retrying in 3s...", e);
          setTimeout(connectBroker, 3000);
        }
      });
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(text || ""));
      return div.innerHTML;
    }

    function send(){
      var val = input.value.trim();
      if(val && client.isConnected() && nameAssigned){
        var payload = JSON.stringify({
          senderId: clientId,
          u: myName,
          m: val
        });
        var message = new Paho.MQTT.Message(payload);
        message.destinationName = chatTopic;
        message.qos = 1;
        client.send(message);
        input.value = "";
      }
    }

    input.addEventListener("keypress", function(e){ 
      if(e.key === "Enter") send(); 
    });

    connectBroker();
  </script>
</body>
</html>
